<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04060f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #04060f;
  }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e9e6ff;
    -webkit-font-smoothing: antialiased;
  }
  #scene {
    display: block;
    width: 100vw; height: 100vh;
    touch-action: none;
    cursor: grab;
  }
  #scene:active { cursor: grabbing; }

  /* ---------------- 标题 ---------------- */
  .brand {
    position: fixed; left: 22px; top: 20px;
    display: flex; gap: 11px; align-items: center;
    pointer-events: none; user-select: none;
  }
  .brand-star {
    font-size: 24px; color: #ffd88a;
    text-shadow: 0 0 20px rgba(255, 200, 110, .95);
    animation: spark 3.4s ease-in-out infinite;
  }
  @keyframes spark {
    0%, 100% { opacity: .55; transform: scale(.9) rotate(0deg); }
    50%      { opacity: 1;   transform: scale(1.1) rotate(12deg); }
  }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .16em; }
  .brand p  { margin: 3px 0 0; font-size: 11px; letter-spacing: .1em; color: rgba(196, 202, 235, .55); }

  /* ---------------- 面板 ---------------- */
  .panel {
    position: fixed; right: 18px; top: 18px; width: 252px;
    max-height: calc(100vh - 36px);
    overflow-y: auto; overflow-x: hidden;
    padding: 14px 16px 12px;
    border-radius: 16px;
    background: rgba(10, 14, 30, .62);
    border: 1px solid rgba(255, 214, 140, .16);
    box-shadow: 0 18px 48px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .06);
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    transition: transform .35s cubic-bezier(.3, .9, .3, 1), opacity .3s;
    z-index: 5;
  }
  .panel::-webkit-scrollbar { width: 5px; }
  .panel::-webkit-scrollbar-thumb { background: rgba(255, 214, 140, .25); border-radius: 9px; }
  .panel.closed {
    transform: translateX(calc(100% + 26px));
    opacity: 0; pointer-events: none;
  }
  .panel header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .panel h2 {
    margin: 0; font-size: 12px; font-weight: 600;
    letter-spacing: .2em; color: rgba(255, 226, 168, .92);
  }
  .mini {
    border: 1px solid rgba(255, 255, 255, .14);
    background: rgba(255, 255, 255, .05);
    color: rgba(230, 230, 255, .78);
    font-size: 11px; padding: 3px 10px; border-radius: 999px;
    cursor: pointer; transition: .2s;
    font-family: inherit;
  }
  .mini:hover { background: rgba(255, 210, 130, .16); color: #ffe4ad; border-color: rgba(255, 210, 130, .4); }

  .acts { display: flex; align-items: center; gap: 6px; }
  .mini.close { padding: 3px 8px; font-size: 12px; line-height: 1; }
  .mini.wide { display: block; width: 100%; margin-top: 10px; padding: 6px 0; text-align: center; }

  .row { margin-bottom: 11px; }
  .lab {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11.5px; color: rgba(214, 218, 245, .8);
    margin-bottom: 3px; letter-spacing: .04em;
  }
  .lab b {
    font-weight: 600; color: #ffdf9e; font-variant-numeric: tabular-nums;
    font-size: 11.5px; text-shadow: 0 0 10px rgba(255, 200, 110, .45);
  }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 16px; background: transparent; cursor: pointer; display: block;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 999px;
    background: linear-gradient(90deg,
      rgba(255, 206, 120, .92) 0%, rgba(255, 206, 120, .92) var(--p, 50%),
      rgba(255, 255, 255, .11) var(--p, 50%), rgba(255, 255, 255, .11) 100%);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; margin-top: -4.5px; border-radius: 50%;
    background: #fff3d2; border: none;
    box-shadow: 0 0 12px rgba(255, 205, 120, .95), 0 0 3px #fff;
  }
  input[type="range"]::-moz-range-track {
    height: 4px; border-radius: 999px; background: rgba(255, 255, 255, .13);
  }
  input[type="range"]::-moz-range-progress {
    height: 4px; border-radius: 999px; background: rgba(255, 206, 120, .92);
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border: none; border-radius: 50%;
    background: #fff3d2; box-shadow: 0 0 12px rgba(255, 205, 120, .95);
  }

  .toggles {
    display: flex; gap: 8px; margin: 13px 0 10px;
  }
  .switch {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 11.5px; color: rgba(214, 218, 245, .8);
    padding: 6px 4px; border-radius: 10px; cursor: pointer;
    background: rgba(255, 255, 255, .045);
    border: 1px solid rgba(255, 255, 255, .07);
    transition: .2s; user-select: none;
  }
  .switch:hover { background: rgba(255, 255, 255, .08); }
  .switch input { display: none; }
  .switch i {
    width: 26px; height: 14px; border-radius: 999px;
    background: rgba(255, 255, 255, .16); position: relative; transition: .25s;
    flex: none;
  }
  .switch i::after {
    content: ""; position: absolute; left: 2px; top: 2px;
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(220, 224, 245, .75); transition: .25s;
  }
  .switch input:checked + i {
    background: rgba(255, 196, 100, .5);
    box-shadow: 0 0 12px rgba(255, 190, 90, .5);
  }
  .switch input:checked + i::after {
    left: 14px; background: #fff5da;
  }

  .panel footer {
    margin-top: 11px; padding-top: 9px;
    border-top: 1px solid rgba(255, 255, 255, .07);
    font-size: 10.5px; letter-spacing: .06em;
    color: rgba(190, 196, 228, .5); text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ---------------- 折叠按钮 ---------------- */
  .toggle {
    position: fixed; right: 18px; top: 18px; z-index: 6;
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 15px;
    color: #ffe0a3;
    background: rgba(12, 17, 34, .88);
    border: 1px solid rgba(255, 214, 140, .5);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45), 0 0 16px rgba(255, 200, 110, .25);
    font-family: inherit;
  }
  .toggle:hover { color: #fff6dd; border-color: rgba(255, 214, 140, .85); }
  .toggle.off { display: none; }

  /* ---------------- 底部提示 ---------------- */
  .hint {
    position: fixed; left: 50%; bottom: 15px; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .12em; white-space: nowrap;
    color: rgba(196, 202, 235, .42);
    pointer-events: none; user-select: none;
    text-align: center;
  }

  @media (max-width: 760px) {
    .panel { width: 226px; right: 12px; top: 12px; padding: 12px 13px 10px; }
    .brand { left: 15px; top: 14px; }
    .brand h1 { font-size: 13px; }
    .brand p { display: none; }
    .toggle { right: 12px; top: 12px; }
    .hint { font-size: 10px; letter-spacing: .06em; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<button id="toggle" class="toggle" title="显示 / 隐藏控制面板">⚙</button>

<aside id="panel" class="panel">
  <header>
    <h2>数值控制</h2>
    <div class="acts">
      <button id="reset" class="mini">重置</button>
      <button id="close" class="mini close" title="关闭设置（Esc）" aria-label="关闭设置">✕</button>
    </div>
  </header>

  <div class="row">
    <div class="lab"><span>星星数量</span><b data-out="count">1600</b></div>
    <input type="range" data-key="count" min="200" max="5000" step="50" value="1600">
  </div>
  <div class="row">
    <div class="lab"><span>螺旋圈数</span><b data-out="turns">6.5</b></div>
    <input type="range" data-key="turns" min="2" max="14" step="0.5" value="6.5">
  </div>
  <div class="row">
    <div class="lab"><span>星光色相</span><b data-out="hue">42°</b></div>
    <input type="range" data-key="hue" min="0" max="360" step="1" value="42">
  </div>
  <div class="row">
    <div class="lab"><span>彩色比例</span><b data-out="colorful">38%</b></div>
    <input type="range" data-key="colorful" min="0" max="1" step="0.01" value="0.38">
  </div>
  <div class="row">
    <div class="lab"><span>光点大小</span><b data-out="size">1.00</b></div>
    <input type="range" data-key="size" min="0.4" max="2.6" step="0.05" value="1">
  </div>
  <div class="row">
    <div class="lab"><span>光晕强度</span><b data-out="glow">1.00</b></div>
    <input type="range" data-key="glow" min="0.2" max="2.4" step="0.05" value="1">
  </div>
  <div class="row">
    <div class="lab"><span>闪烁速度</span><b data-out="twinkle">1.10</b></div>
    <input type="range" data-key="twinkle" min="0" max="3" step="0.05" value="1.1">
  </div>
  <div class="row">
    <div class="lab"><span>自转速度</span><b data-out="spin">0.35</b></div>
    <input type="range" data-key="spin" min="0" max="2" step="0.02" value="0.35">
  </div>
  <div class="row">
    <div class="lab"><span>树的高度</span><b data-out="height">1.00</b></div>
    <input type="range" data-key="height" min="0.5" max="1.2" step="0.01" value="1">
  </div>
  <div class="row">
    <div class="lab"><span>树的半径</span><b data-out="treeRadius">1.00</b></div>
    <input type="range" data-key="treeRadius" min="0.6" max="1.6" step="0.02" value="1">
  </div>
  <div class="row">
    <div class="lab"><span>雪花强度</span><b data-out="snowLevel">2.00</b></div>
    <input type="range" data-key="snowLevel" min="0" max="6" step="0.05" value="2">
  </div>

  <div class="toggles">
    <label class="switch"><input type="checkbox" data-key="autoSpin" checked><i></i><span>自动旋转</span></label>
    <label class="switch"><input type="checkbox" data-key="snow" checked><i></i><span>飘雪</span></label>
  </div>

  <button id="replay" class="mini wide">↻ 重播开场动画</button>

  <footer id="stats">1600 颗星光 · 200 FPS</footer>
</aside>

<script>
(() => {
  'use strict';

  /* ========================= 基础工具 ========================= */
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  /* ========================= 可调数值 ========================= */
  const DEFAULTS = {
    count: 1600,      // 星光数量
    turns: 6.5,       // 彩带螺旋圈数
    hue: 42,          // 主色调
    colorful: 0.38,   // 彩色灯珠比例
    size: 1,          // 光点大小
    glow: 1,          // 光晕强度
    twinkle: 1.1,     // 闪烁速度
    spin: 0.35,       // 自转速度
    height: 1,        // 树高
    treeRadius: 1,    // 树底半径
    snowLevel: 2,     // 雪花强度
    autoSpin: true,
    snow: true
  };
  const cfg = Object.assign({}, DEFAULTS);

  const view = { yaw: 0.35, pitch: 0.13, zoom: 1, targetZoom: 1 };

  /* ========================= 画布 & 布局 ========================= */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const bg = document.createElement('canvas');
  const bgCtx = bg.getContext('2d');

  let W = 1, H = 1, DPR = 1;
  let cx = 0, cy = 0;      // 画面中树中心点
  let treeH = 420;         // 树高(px)：顶端到底端的距离
  let baseR = 140;         // 树底半径(px)：只跟屏幕尺寸有关，不受高度影响
  let treeR = 140;         // 树底半径(px)：可调，= baseR * treeRadius
  let baseRX = 0;          // 底盘在屏幕上的椭圆半径
  let baseRY = 0;
  let platScale = 1;       // 底盘与礼物的整体缩放（跟着树的半径走）
  let giftShiftPx = 0;     // 礼物堆的水平平移，用来维持它与树的间距
  let camDist = 900;       // 相机距离（越小透视越强、3D 感越明显）
  let refSize = 520;       // 屏幕基准尺寸（宽度、光点大小、顶部星的大小都由它决定）
  let groundY = 0;         // 地面高度

  /* ========================= 星空 / 雪 / 烟花 ========================= */
  let skyStars = [];
  let snow = [];
  let lights = [];

  /* ========================= 精灵缓存 ========================= */
  const dotCache = new Map();
  const starCache = new Map();

  // 圆形柔光点：白色内核 + 彩色光晕
  function makeDot(hue, sat) {
    const S = 64;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    grad.addColorStop(0.00, 'rgba(255,255,255,1)');
    grad.addColorStop(0.15, 'hsla(' + hue + ',' + sat + '%,90%,0.92)');
    grad.addColorStop(0.36, 'hsla(' + hue + ',' + sat + '%,72%,0.40)');
    grad.addColorStop(0.66, 'hsla(' + hue + ',' + sat + '%,64%,0.10)');
    grad.addColorStop(1.00, 'hsla(' + hue + ',' + sat + '%,60%,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, S, S);
    return c;
  }
  function dotSprite(hue) {
    const key = Math.round(hue / 6) * 6;
    let sp = dotCache.get(key);
    if (!sp) {
      sp = makeDot(key, 100);
      dotCache.set(key, sp);
      if (dotCache.size > 150) dotCache.delete(dotCache.keys().next().value);
    }
    return sp;
  }

  // 四芒星：用于顶部大星与闪烁高光
  function makeStar(hue) {
    const S = 128, c0 = S / 2, arm = S / 2 - 3;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');

    const glow = g.createRadialGradient(c0, c0, 0, c0, c0, S / 2);
    glow.addColorStop(0.00, 'rgba(255,255,255,0.95)');
    glow.addColorStop(0.10, 'hsla(' + hue + ',100%,92%,0.65)');
    glow.addColorStop(0.30, 'hsla(' + hue + ',100%,74%,0.18)');
    glow.addColorStop(1.00, 'hsla(' + hue + ',100%,64%,0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, S, S);

    g.globalCompositeOperation = 'lighter';

    const beamH = g.createLinearGradient(c0 - arm, c0, c0 + arm, c0);
    beamH.addColorStop(0.00, 'hsla(' + hue + ',100%,80%,0)');
    beamH.addColorStop(0.50, 'rgba(255,255,255,1)');
    beamH.addColorStop(1.00, 'hsla(' + hue + ',100%,80%,0)');
    g.fillStyle = beamH;
    g.fillRect(c0 - arm, c0 - 1.5, arm * 2, 3);

    const beamV = g.createLinearGradient(c0, c0 - arm, c0, c0 + arm);
    beamV.addColorStop(0.00, 'hsla(' + hue + ',100%,80%,0)');
    beamV.addColorStop(0.50, 'rgba(255,255,255,1)');
    beamV.addColorStop(1.00, 'hsla(' + hue + ',100%,80%,0)');
    g.fillStyle = beamV;
    g.fillRect(c0 - 1.5, c0 - arm, 3, arm * 2);

    return c;
  }
  function starSprite(hue) {
    const key = Math.round(hue / 20) * 20;
    let sp = starCache.get(key);
    if (!sp) {
      sp = makeStar(key);
      starCache.set(key, sp);
      if (starCache.size > 40) starCache.delete(starCache.keys().next().value);
    }
    return sp;
  }
  const whiteSprite = makeDot(210, 22);

  /* ========================= 生成星光：树 + 底座 + 礼物盒 ========================= */
  const FESTIVE = [0, 20, 46, 92, 140, 176, 204, 266, 300, 336];

  function buildLights() {
    const arr = [];
    buildTreeLights(arr);
    buildBaseLights(arr);
    buildGiftLights(arr);
    lights = arr;
  }

  // 统一粒子工厂：kind 0=树(y 以树高为单位) 1=底座 2=礼物(y 以树底半径为单位)
  function mkLight(arr, x, y, z, hue, sizeK, bright, kind, delayMax) {
    const oAng = Math.random() * TAU;
    const oDist = kind === 0 ? rand(1.3, 3.4) : rand(0.8, 2.8);
    arr.push({
      x: x, y: y, z: z,
      hue: hue,
      sizeK: sizeK,
      bright: bright,
      phase: rand(0, TAU),
      speed: rand(0.7, 2.6),
      sparkle: Math.random() < 0.24,
      kind: kind,
      ox: kind === 0 ? Math.cos(oAng) * oDist : x + Math.cos(oAng) * oDist,
      oy: kind === 0 ? rand(-0.45, 1.75) : y + rand(-0.10, 0.55),
      oz: kind === 0 ? Math.sin(oAng) * oDist : z + Math.sin(oAng) * oDist,
      delay: Math.random() * (delayMax || 0.35)
    });
  }

  // —— 圣诞树本体：双螺旋灯带 + 分层枝环，勾出清楚的锥形轮廓 ——
  function buildTreeLights(arr) {
    const n = Math.round(cfg.count);
    for (let i = 0; i < n; i++) {
      const roll = Math.random();
      let t, ang, rad;

      if (roll < 0.60) {
        // 双螺旋灯带：两条错开 180°，缠绕着往上盘
        t = 1 - Math.sqrt(Math.random());
        const rBase = Math.pow(1 - t, 1.08);
        const strand = Math.random() < 0.5 ? 0 : Math.PI;
        ang = t * cfg.turns * TAU + strand + rand(-0.10, 0.10);
        rad = rBase * rand(0.93, 1.0);
      } else if (roll < 0.90) {
        // 分层枝环：6 层水平枝叶，把树的基础轮廓和层次显出来
        const tier = (Math.random() * 6) | 0;
        t = clamp(0.07 + tier * 0.15 + rand(-0.025, 0.025), 0, 1);
        const rBase = Math.pow(1 - t, 1.08);
        ang = Math.random() * TAU;
        rad = rBase * rand(0.88, 1.0);
      } else {
        // 少量内部散点，补一点体积感
        t = 1 - Math.sqrt(Math.random());
        const rBase = Math.pow(1 - t, 1.08);
        ang = Math.random() * TAU;
        rad = rBase * rand(0.35, 0.8);
      }

      const hue = Math.random() < cfg.colorful
        ? FESTIVE[(Math.random() * FESTIVE.length) | 0] + rand(-7, 7)
        : cfg.hue + rand(-9, 9);

      let sizeK = rand(0.55, 1.35);                  // 少量“大灯珠”做点缀
      if (Math.random() < 0.03) sizeK *= 1.7;

      mkLight(arr, Math.cos(ang) * rad, clamp(t + rand(-0.008, 0.008), 0, 1), Math.sin(ang) * rad,
        hue, sizeK, rand(0.5, 1), 0, 0.35);
    }
  }

  // —— 星光底座：三层星环 + 侧壁 + 台面浮尘，全部由同一种光点组成 ——
  function buildBaseLights(arr) {
    const hue0 = cfg.hue;

    // 前缘亮、后缘暗：底盘也因此有立体厚度
    const frontK = (a) => 0.42 + 0.58 * (1 - Math.sin(a)) / 2;

    const ring = (radius, y, count, sizeK, bright) => {
      for (let i = 0; i < count; i++) {
        const a = (i / count) * TAU;
        const r = radius * rand(0.995, 1.005);
        mkLight(arr, Math.cos(a) * r, y + rand(-0.005, 0.005), Math.sin(a) * r,
          hue0 + rand(-8, 8), sizeK * rand(0.8, 1.25), bright * frontK(a) * rand(0.75, 1), 1, 0.2);
      }
    };
    ring(1.75, 0.000, 168, 0.62, 0.95);   // 台沿
    ring(1.63, -0.055, 78, 0.55, 0.70);   // 下沿，做出厚度
    ring(1.35, 0.012, 84, 0.50, 0.60);    // 内圈

    // 侧壁竖向连线
    for (let i = 0; i < 30; i++) {
      const a = (i / 30) * TAU;
      for (let k = 1; k <= 2; k++) {
        const t = k / 3;
        const r = 1.75 + (1.63 - 1.75) * t;
        mkLight(arr, Math.cos(a) * r, -0.055 * t, Math.sin(a) * r,
          hue0 + rand(-10, 10), 0.45 * rand(0.8, 1.2), 0.55 * frontK(a) * rand(0.6, 1), 1, 0.2);
      }
    }

    // 台面浮尘
    for (let i = 0; i < 110; i++) {
      const a = Math.random() * TAU;
      const r = Math.sqrt(Math.random()) * 1.70;
      mkLight(arr, Math.cos(a) * r, rand(-0.004, 0.022), Math.sin(a) * r,
        hue0 + rand(-12, 12), rand(0.35, 0.7), rand(0.35, 0.8) * frontK(a), 1, 0.22);
    }
  }

  // —— 星光礼物盒：四个（下三上一），在圣诞树左侧的底盘上独立堆叠 ——
  const GIFT_BOXES = [
    { x: -1.10, z: -0.16, side: 0.28, y: 0.00, hue: 356, ribbon: 45 },   // 左后
    { x: -1.50, z: -0.16, side: 0.28, y: 0.00, hue: 140, ribbon: 45 },   // 右后
    { x: -1.30, z: -0.50, side: 0.32, y: 0.00, hue: 216, ribbon: 45 },   // 正前
    { x: -1.30, z: -0.28, side: 0.26, y: 0.28, hue: 44, ribbon: 356 }    // 压在三个上面
  ];

  function buildGiftLights(arr) {
    const GS = 1 / 1.3;                              // 礼盒整体缩小 1.3 倍
    const CX0 = -1.30, CZ0 = -0.30;                   // 缩放基准点 = 礼物堆中心

    const line = (x0, y0, z0, x1, y1, z1, hue, n, sizeK, bright) => {
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        mkLight(arr,
          x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z0 + (z1 - z0) * t,
          hue + rand(-8, 8), sizeK * rand(0.85, 1.15), bright * rand(0.75, 1), 2, 0.3);
      }
    };

    for (let b = 0; b < GIFT_BOXES.length; b++) {
      const g = GIFT_BOXES[b];

      // 以堆中心为基准点整体缩小
      const s = g.side * GS;
      const gx = CX0 + (g.x - CX0) * GS;
      const gz = CZ0 + (g.z - CZ0) * GS;
      const x0 = gx - s / 2, x1 = gx + s / 2;
      const z0 = gz - s / 2, z1 = gz + s / 2;
      const y0 = g.y * GS, y1 = y0 + s;
      const h = g.hue, rh = g.ribbon;

      // 上下各四条棱
      line(x0, y0, z0, x1, y0, z0, h, 9, 0.60, 0.72);
      line(x0, y0, z1, x1, y0, z1, h, 9, 0.60, 0.72);
      line(x0, y0, z0, x0, y0, z1, h, 9, 0.60, 0.72);
      line(x1, y0, z0, x1, y0, z1, h, 9, 0.60, 0.72);
      line(x0, y1, z0, x1, y1, z0, h, 9, 0.68, 0.86);
      line(x0, y1, z1, x1, y1, z1, h, 9, 0.68, 0.86);
      line(x0, y1, z0, x0, y1, z1, h, 9, 0.68, 0.86);
      line(x1, y1, z0, x1, y1, z1, h, 9, 0.68, 0.86);
      // 四条竖棱
      line(x0, y0, z0, x0, y1, z0, h, 10, 0.64, 0.80);
      line(x1, y0, z0, x1, y1, z0, h, 10, 0.64, 0.80);
      line(x0, y0, z1, x0, y1, z1, h, 10, 0.64, 0.80);
      line(x1, y0, z1, x1, y1, z1, h, 10, 0.64, 0.80);

      // 四个立面的竖向缎带
      line(x0, y0, gz, x0, y1, gz, rh, 9, 0.50, 0.52);
      line(x1, y0, gz, x1, y1, gz, rh, 9, 0.50, 0.52);
      line(gx, y0, z0, gx, y1, z0, rh, 9, 0.50, 0.52);
      line(gx, y0, z1, gx, y1, z1, rh, 9, 0.50, 0.52);

      // 顶面十字缎带
      line(x0, y1, gz, x1, y1, gz, rh, 9, 0.56, 0.60);
      line(gx, y1, z0, gx, y1, z1, rh, 9, 0.56, 0.60);

      // 盒内的柔光，让盒子“成块”
      for (let i = 0; i < 6; i++) {
        mkLight(arr,
          gx + rand(-s * 0.32, s * 0.32),
          y0 + rand(s * 0.22, s * 0.78),
          gz + rand(-s * 0.32, s * 0.32),
          h + rand(-12, 12), rand(1.1, 1.8), rand(0.05, 0.12), 2, 0.3);
      }

      // 蝴蝶结
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * TAU;
        const r = rand(0.008, 0.045);
        mkLight(arr, gx + Math.cos(a) * r, y1 + rand(0.008, 0.04), gz + Math.sin(a) * r,
          rh + rand(-10, 10), rand(0.55, 0.8), rand(1.0, 1.25), 2, 0.3);
      }
    }
  }

  // 树和礼物在底盘上的接触阴影：让物体“坐”在台面上，而不是飘着
  function drawContactShadows() {
    const gi = clamp((intro - 0.18) / 0.5, 0, 1);
    if (gi <= 0) return;

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = gi;

    // 树的阴影
    const w = Math.max(20, treeR * 1.12);
    ctx.save();
    ctx.translate(cx, groundY + baseRY * 0.10);
    ctx.scale(1, Math.max(0.08, (baseRY * 0.46) / w));
    const g1 = ctx.createRadialGradient(0, 0, 0, 0, 0, w);
    g1.addColorStop(0.00, 'rgba(5,8,16,0.42)');
    g1.addColorStop(0.55, 'rgba(5,8,16,0.20)');
    g1.addColorStop(1.00, 'rgba(5,8,16,0)');
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.arc(0, 0, w, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 礼物堆的阴影
    const gx = cx + (-1.30 * baseR + giftShiftPx);
    const gy = groundY + baseRY * 0.16;
    const gw = Math.max(10, baseR * 0.42);
    ctx.save();
    ctx.translate(gx, gy);
    ctx.scale(1, 0.34);
    const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, gw);
    g2.addColorStop(0.00, 'rgba(5,8,16,0.50)');
    g2.addColorStop(0.60, 'rgba(5,8,16,0.24)');
    g2.addColorStop(1.00, 'rgba(5,8,16,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(0, 0, gw, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 底座脚下的辉光（只是光，真正的底座由上面的粒子组成）
  function drawBaseGlow() {
    const gi = clamp((intro - 0.12) / 0.55, 0, 1);
    if (gi <= 0) return;
    const rx = baseR * 1.75 * platScale;
    // 底座不参与旋转/俯仰，它的椭圆形状来自透视，这里按同一套公式算出来
    const camB = camDist;
    const pf = camB / Math.max(1, camB - rx);
    const pb = camB / (camB + rx);
    const ry = Math.max(2, (treeH * 0.5) * (pf - pb) * 0.5);
    const pulse = 0.85 + 0.15 * Math.sin(time * 1.3);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(cx, groundY);
    ctx.scale(1, ry / rx);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0.00, 'hsla(' + cfg.hue + ',95%,80%,' + (0.11 * gi * pulse * cfg.glow) + ')');
    g.addColorStop(0.60, 'hsla(' + cfg.hue + ',95%,68%,' + (0.045 * gi * pulse * cfg.glow) + ')');
    g.addColorStop(0.95, 'hsla(' + cfg.hue + ',95%,62%,' + (0.015 * gi * pulse * cfg.glow) + ')');
    g.addColorStop(1.00, 'hsla(' + cfg.hue + ',95%,60%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* ========================= 尺寸 & 背景 ========================= */
  function layout() {
    refSize = Math.min(H * 0.70, W * 1.35);

    // 礼盒与树的间距：6 个单位（1 单位 = 0.05 个树底半径）
    const GIFT_UNIT = 0.05;
    const stackHalf = 0.34 * (1 / 1.3);             // 礼物堆半宽（已缩小 1.3 倍）
    const giftCenterU = cfg.treeRadius + 6 * GIFT_UNIT + stackHalf;
    const platRU = giftCenterU + stackHalf + 0.35;  // 底盘半径（以树底半径为单位）
    platScale = platRU / 1.75;                      // 底盘随树半径整体缩放

    // 底座 + 礼物堆比树本身宽，窄屏时把整组等比缩小，保证它们都在画面内
    const compHalf = platRU * 1.2 * 0.335 * refSize;
    const limit = W * 0.47;
    if (compHalf > limit) refSize *= limit / compHalf;

    cx = W * 0.5;

    // 宽度只跟屏幕尺寸有关；「树的高度」只改变顶端到底端的垂直距离：
    // 底端固定在地面线，顶端上下移动（树变高/变矮，而不是整体放大缩小）
    baseR = refSize * 0.335;
    treeR = baseR * cfg.treeRadius;                 // 树底半径可调
    camDist = refSize * 1.7;                        // 相机更近 → 透视更强、更立体

    // 底盘在屏幕上的椭圆比例先算出来，用来给底盘前缘留出空间
    baseRX = baseR * 1.75 * platScale;
    const camB = camDist;
    const pf = camB / Math.max(1, camB - baseRX);
    const pb = camB / (camB + baseRX);
    const ryUnit = (pf - pb) * 0.25;                // baseRY = treeH * ryUnit

    // 地面线：底盘整体（前后缘）要落在画面内
    groundY = Math.min(H * 0.88, H - refSize * cfg.height * ryUnit - H * 0.03);

    treeH = Math.min(refSize * cfg.height, groundY - H * 0.05);
    baseRY = Math.max(2, treeH * ryUnit);

    // 把礼物堆中心推到「树半径 + 间距 + 半宽」处，与树保持固定间距
    giftShiftPx = (-giftCenterU + 1.30) * baseR;

    cy = groundY - treeH * 0.5;
  }

  function drawBackground() {
    const g = bgCtx;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);

    const base = g.createLinearGradient(0, 0, 0, H);
    base.addColorStop(0, '#03050e');
    base.addColorStop(0.55, '#070b18');
    base.addColorStop(1, '#0a0f1e');
    g.fillStyle = base;
    g.fillRect(0, 0, W, H);

    // 冷色天光
    const halo = g.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, Math.max(W, H) * 0.66);
    halo.addColorStop(0, 'rgba(48,86,150,0.20)');
    halo.addColorStop(0.5, 'rgba(26,44,92,0.09)');
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = halo;
    g.fillRect(0, 0, W, H);

    // 地面柔和反射（顶部渐入，避免出现横向硬边）
    const gTop = Math.max(0, groundY - Math.min(H * 0.26, 190));
    const gl = g.createLinearGradient(0, gTop, 0, H);
    gl.addColorStop(0.00, 'rgba(255,196,110,0)');
    gl.addColorStop(0.55, 'rgba(255,196,110,0.045)');
    gl.addColorStop(1.00, 'rgba(255,180,90,0)');
    g.fillStyle = gl;
    g.fillRect(0, gTop, W, H - gTop);

    // 暗角
    const vig = g.createRadialGradient(W * 0.5, H * 0.48, Math.min(W, H) * 0.22,
                                       W * 0.5, H * 0.48, Math.max(W, H) * 0.8);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.62)');
    g.fillStyle = vig;
    g.fillRect(0, 0, W, H);
  }

  function initSkyStars() {
    skyStars = [];
    const n = Math.round((W * H) / 9000);
    for (let i = 0; i < n; i++) {
      skyStars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.82,
        r: rand(0.35, 1.35),
        ph: rand(0, TAU),
        sp: rand(0.25, 1.1)
      });
    }
  }

  function newFlake(spread) {
    const big = Math.random() < 0.08;                    // 少量近景大雪花
    return {
      x: Math.random() * W,
      y: spread ? Math.random() * H : -14 - Math.random() * 70,
      r: big ? rand(2.8, 4.4) : rand(0.5, 2.1),
      vy: big ? rand(30, 56) : rand(12, 46),
      vx: rand(-11, 11),
      ph: rand(0, TAU),
      front: big ? Math.random() < 0.65 : Math.random() < 0.3,
      a: big ? rand(0.09, 0.20) : rand(0.28, 0.85),
      rest: 0                                          // >0 表示已落到底盘上，正在停留
    };
  }
  function initSnow() {
    snow = [];
    const n = Math.round((W * H) / 6200 * cfg.snowLevel);
    for (let i = 0; i < n; i++) snow.push(newFlake(true));
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    bg.width = canvas.width;
    bg.height = canvas.height;
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

    layout();
    drawBackground();
    initSkyStars();
    initSnow();
  }

  /* ========================= 主循环 ========================= */
  let time = 0;
  let last = performance.now();
  let fps = 60, fpsAcc = 0, fpsFrames = 0, statsAt = 0;

  /* 出厂动画进度：0 = 散乱星尘，1 = 聚成圣诞树 */
  const INTRO_DUR = 3.2;
  let intro = 0;

  // 雪花落到底盘上的落点高度（不在底盘范围内返回一个极大值，等于直接飘过去）
  function snowFloorY(x) {
    if (baseRY <= 0) return 1e9;
    const u = (x - cx) / baseRX;
    if (u <= -0.97 || u >= 0.97) return 1e9;
    return groundY + baseRY * Math.sqrt(1 - u * u) * 0.5;
  }

  function update(dt) {
    if (intro < 1) intro = Math.min(1, intro + dt / INTRO_DUR);
    if (cfg.autoSpin) view.yaw += cfg.spin * dt;
    view.zoom += (view.targetZoom - view.zoom) * Math.min(1, dt * 10);

    // 雪
    if (cfg.snow) {
      const gust = Math.sin(time * 0.33) * 14;           // 缓慢变化的阵风
      for (let i = 0; i < snow.length; i++) {
        const f = snow[i];

        // 已经落在底盘上的雪花：静静停留，3 秒后化掉
        if (f.rest > 0) {
          f.rest -= dt;
          if (f.rest <= 0) snow[i] = newFlake(false);
          continue;
        }

        f.y += f.vy * dt;
        f.x += (f.vx + gust + Math.sin(time * 1.1 + f.ph) * 10) * dt;

        // 落进底盘范围就被接住，停留 3 秒
        if (f.y >= snowFloorY(f.x)) { f.rest = 3; continue; }

        if (f.y > H + 16 || f.x < -40 || f.x > W + 40) snow[i] = newFlake(false);
      }
    }
  }

  function render() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    const cosY = Math.cos(view.yaw), sinY = Math.sin(view.yaw);
    const cosP = Math.cos(view.pitch), sinP = Math.sin(view.pitch);

    drawGroundGlow();
    drawBaseGlow();
    drawContactShadows();
    drawSkyStars();
    drawSnow(false);
    drawTree(cosY, sinY, cosP, sinP);
    drawTopStar(cosP, sinP);
    drawGiftOutlines();
    drawSnow(true);

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawGroundGlow() {
    const pulse = (0.78 + 0.22 * Math.sin(time * 1.1)) * Math.min(1, intro * 1.5);
    ctx.save();
    ctx.translate(cx, groundY);
    ctx.scale(1, 0.3);
    const r = Math.max(60, baseR * 2.4);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, 'hsla(' + cfg.hue + ',92%,62%,' + (0.13 * pulse * cfg.glow) + ')');
    g.addColorStop(0.45, 'hsla(' + cfg.hue + ',92%,56%,' + (0.045 * pulse * cfg.glow) + ')');
    g.addColorStop(1, 'hsla(' + cfg.hue + ',92%,50%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawSkyStars() {
    for (let i = 0; i < skyStars.length; i++) {
      const s = skyStars[i];
      const a = 0.18 + 0.42 * (0.5 + 0.5 * Math.sin(time * s.sp + s.ph));
      const w = s.r * 7;
      ctx.globalAlpha = a;
      ctx.drawImage(whiteSprite, s.x - w / 2, s.y - w / 2, w, w);
    }
    ctx.globalAlpha = 1;
  }

  function drawSnow(front) {
    if (!cfg.snow) return;
    for (let i = 0; i < snow.length; i++) {
      const f = snow[i];
      const resting = f.rest > 0;
      // 已经落到底盘上的雪花只在「前景层」画（在底盘和树之上）
      if (resting ? !front : f.front !== front) continue;

      if (resting) {
        // 落在底盘上的雪花：更白更实，停留 3 秒，最后 0.6 秒淡出
        const w = Math.max(6, f.r * 13);
        ctx.globalAlpha = clamp(0.92 * Math.min(1, f.rest / 0.6), 0, 1);
        ctx.drawImage(whiteSprite, f.x - w / 2, f.y - w / 2, w, w);
        continue;
      }

      const tw = 0.55 + 0.45 * Math.sin(time * 1.4 + f.ph);
      const w = f.r * 9;
      ctx.globalAlpha = clamp(f.a * tw * (front ? 1 : 0.65), 0, 1);
      ctx.drawImage(whiteSprite, f.x - w / 2, f.y - w / 2, w, w);
    }
    ctx.globalAlpha = 1;
  }

  function drawTree(cosY, sinY, cosP, sinP) {
    const zoom = view.zoom;
    const halfH = treeH * 0.5;
    const camBase = camDist;
    const unit = refSize * 0.0058;     // 单个光点基准半径（不随树高变化）
    const twSpeed = cfg.twinkle;
    let sparkles = 0;

    for (let i = 0; i < lights.length; i++) {
      const L = lights[i];

      // 出厂动画：从散乱星尘位置插值到最终树形位置
      let nx = L.x, ny = L.y, nz = L.z, settle = 1;
      if (intro < 1) {
        let p = (intro - L.delay) / (1 - L.delay);
        p = p <= 0 ? 0 : p >= 1 ? 1 : p;
        settle = 1 - Math.pow(1 - p, 4);          // 先快后慢，落位柔和
        nx = L.ox + (L.x - L.ox) * settle;
        ny = L.oy + (L.y - L.oy) * settle;
        nz = L.oz + (L.z - L.oz) * settle;
      }

      // 树：半径可调，随视角旋转
      // 底盘：随树半径缩放，不旋转
      // 礼物：整体平移到与树保持固定间距的位置，不旋转
      let wx, wz;
      if (L.kind === 0) {
        wx = nx * treeR;
        wz = nz * treeR;
      } else if (L.kind === 1) {
        wx = nx * baseR * platScale;
        wz = nz * baseR * platScale;
      } else {
        wx = nx * baseR + giftShiftPx;
        wz = nz * baseR;
      }
      // kind 0 的 y 以树高为单位；底座/礼物以树底半径为单位，保证礼物盒是立方比例
      const wy = (L.kind === 0 ? ny * treeH : ny * baseR) - halfH;

      // 树随视角旋转；底座和礼物固定在场景里，跟着镜头转的是树而不是它们
      const cY = L.kind ? 1 : cosY, sY = L.kind ? 0 : sinY;
      const cP = L.kind ? 1 : cosP, sP = L.kind ? 0 : sinP;

      // 绕 Y 轴旋转
      const x1 = wx * cY - wz * sY;
      const z1 = wx * sY + wz * cY;
      // 绕 X 轴俯仰
      const y2 = wy * cP - z1 * sP;
      const z2 = wy * sP + z1 * cP;
      // 透视
      const persp = camBase / (camBase + z2);

      const sx = cx + x1 * persp * zoom;
      const sy = cy - y2 * persp * zoom;
      if (sx < -70 || sx > W + 70 || sy < -70 || sy > H + 70) continue;

      // 闪烁
      const tw = 0.5 + 0.5 * Math.sin(time * L.speed * twSpeed + L.phase);
      // 立体感：正对镜头（近）的灯更亮更大，背面的灯明显暗一些
      const depth = 0.26 + 0.92 * clamp((persp - 0.72) / 0.52, 0, 1);
      let a = (0.22 + 0.78 * tw) * L.bright * depth * cfg.glow * 0.95;
      if (settle < 1) {
        a *= 0.12 + 0.88 * settle;                                   // 飞行途中偏暗
        if (settle > 0.7) a *= 1 + (1 - (settle - 0.7) / 0.3) * 0.8; // 落位瞬间闪一下
      }
      const alpha = clamp(a, 0, 1);

      const r = unit * L.sizeK * cfg.size * persp * zoom;
      const w = r * 5.5;

      ctx.globalAlpha = alpha;
      ctx.drawImage(dotSprite(L.hue), sx - w / 2, sy - w / 2, w, w);

      // 部分星光在闪烁峰值时炸开四芒星
      if (L.sparkle && tw > 0.9 && sparkles < 72) {
        sparkles++;
        const sw = r * 9;
        ctx.globalAlpha = alpha * 0.72 * ((tw - 0.9) / 0.1);
        ctx.drawImage(starSprite(L.hue), sx - sw / 2, sy - sw / 2, sw, sw);
      }
    }
    ctx.globalAlpha = 1;
  }

  // 礼物盒的光线框：把 12 条棱和缎带用细光描出来，盒子形状一眼可辨
  function drawGiftOutlines() {
    const a = clamp((intro - 0.45) / 0.4, 0, 1);
    if (a <= 0) return;
    const ease = a * a * (3 - 2 * a);

    const halfH = treeH * 0.5;
    const camBase = camDist;
    const zoom = view.zoom;

    // 与粒子完全一致的投影（礼物不旋转、不俯仰）
    const proj = (x, y, z) => {
      const wx = x * baseR + giftShiftPx;
      const wy = y * baseR - halfH;
      const wz = z * baseR;
      const persp = camBase / (camBase + wz);
      return [cx + wx * persp * zoom, cy - wy * persp * zoom];
    };

    const GS = 1 / 1.3;
    const CX0 = -1.30, CZ0 = -0.30;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    for (let b = 0; b < GIFT_BOXES.length; b++) {
      const g = GIFT_BOXES[b];
      const s = g.side * GS;
      const gx = CX0 + (g.x - CX0) * GS;
      const gz = CZ0 + (g.z - CZ0) * GS;
      const y0 = g.y * GS, y1 = y0 + s;
      const x0 = gx - s / 2, x1 = gx + s / 2;
      const z0 = gz - s / 2, z1 = gz + s / 2;

      // 8 个顶点
      const v000 = proj(x0, y0, z0), v100 = proj(x1, y0, z0);
      const v001 = proj(x0, y0, z1), v101 = proj(x1, y0, z1);
      const v010 = proj(x0, y1, z0), v110 = proj(x1, y1, z0);
      const v011 = proj(x0, y1, z1), v111 = proj(x1, y1, z1);

      const edges = [
        [v000, v100], [v001, v101], [v000, v001], [v100, v101],   // 底
        [v010, v110], [v011, v111], [v010, v011], [v110, v111],   // 顶
        [v000, v010], [v100, v110], [v001, v011], [v101, v111]    // 竖棱
      ];

      // 先画一层虚光，再画细实线，边缘有发光感
      ctx.strokeStyle = 'hsla(' + g.hue + ',100%,70%,' + (0.18 * ease) + ')';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      for (let i = 0; i < edges.length; i++) {
        ctx.moveTo(edges[i][0][0], edges[i][0][1]);
        ctx.lineTo(edges[i][1][0], edges[i][1][1]);
      }
      ctx.stroke();

      ctx.strokeStyle = 'hsla(' + g.hue + ',100%,78%,' + (0.55 * ease) + ')';
      ctx.lineWidth = 1.1;
      ctx.stroke();

      // 极淡的光面填充：让盒子有体积，仍然透出后面的星光
      ctx.fillStyle = 'hsla(' + g.hue + ',100%,62%,' + (0.05 * ease) + ')';
      ctx.beginPath();
      ctx.moveTo(v000[0], v000[1]); ctx.lineTo(v100[0], v100[1]);
      ctx.lineTo(v110[0], v110[1]); ctx.lineTo(v010[0], v010[1]);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'hsla(' + g.hue + ',100%,74%,' + (0.075 * ease) + ')';   // 顶面更亮
      ctx.beginPath();
      ctx.moveTo(v010[0], v010[1]); ctx.lineTo(v110[0], v110[1]);
      ctx.lineTo(v111[0], v111[1]); ctx.lineTo(v011[0], v011[1]);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'hsla(' + g.hue + ',100%,55%,' + (0.038 * ease) + ')';   // 侧面更暗
      ctx.beginPath();
      ctx.moveTo(v100[0], v100[1]); ctx.lineTo(v101[0], v101[1]);
      ctx.lineTo(v111[0], v111[1]); ctx.lineTo(v110[0], v110[1]);
      ctx.closePath();
      ctx.fill();

      // 缎带：四个立面竖线 + 顶面十字
      const rib = [
        [proj(x0, y0, gz), proj(x0, y1, gz)],
        [proj(x1, y0, gz), proj(x1, y1, gz)],
        [proj(gx, y0, z0), proj(gx, y1, z0)],
        [proj(gx, y0, z1), proj(gx, y1, z1)],
        [proj(x0, y1, gz), proj(x1, y1, gz)],
        [proj(gx, y1, z0), proj(gx, y1, z1)]
      ];
      ctx.strokeStyle = 'hsla(' + g.ribbon + ',100%,88%,' + (0.26 * ease) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let i = 0; i < rib.length; i++) {
        ctx.moveTo(rib[i][0][0], rib[i][0][1]);
        ctx.lineTo(rib[i][1][0], rib[i][1][1]);
      }
      ctx.stroke();

      // 顶面蝴蝶结：两个环 + 中心结
      const perspC = camBase / (camBase + gz * baseR);
      const px = baseR * perspC * zoom;
      const bx = proj(gx, y1, gz);
      const bw = s * 0.46 * px;
      const bh = bw * 0.34;
      ctx.strokeStyle = 'hsla(' + g.ribbon + ',100%,90%,' + (0.55 * ease) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(bx[0] - bw * 0.62, bx[1], bw * 0.58, bh, -0.5, 0, TAU);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(bx[0] + bw * 0.62, bx[1], bw * 0.58, bh, 0.5, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = 'hsla(' + g.ribbon + ',100%,92%,' + (0.7 * ease) + ')';
      ctx.beginPath();
      ctx.arc(bx[0], bx[1], Math.max(1.2, bh * 0.55), 0, TAU);
      ctx.fill();
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawTopStar(cosP, sinP) {
    // 出厂动画：等星光差不多聚拢完，树顶星芒才亮起
    const starIn = intro <= 0.72 ? 0 : (intro - 0.72) / 0.28;
    if (starIn <= 0) return;
    const pop = starIn * starIn * (3 - 2 * starIn);

    const halfH = treeH * 0.5;
    const wy = treeH - halfH;      // 树尖（在旋转轴上）
    const z2 = wy * sinP;
    const camBase = camDist;
    const persp = camBase / (camBase + z2 * 0.6);
    const sx = cx;
    const sy = cy - (wy * cosP) * persp * view.zoom;

    const pulse = 0.84 + 0.16 * Math.sin(time * 2.3);
    const size = refSize * 0.09 * pulse * view.zoom * (0.55 + 0.45 * pop);

    // 外光晕
    const hw = size * 4.2;
    ctx.globalAlpha = clamp(0.5 * cfg.glow, 0, 1) * starIn;
    ctx.drawImage(dotSprite(cfg.hue), sx - hw / 2, sy - hw / 2, hw, hw);

    // 星芒
    const sw = size * 2.1;
    ctx.globalAlpha = clamp(0.95 * cfg.glow, 0, 1) * starIn;
    ctx.drawImage(starSprite(cfg.hue), sx - sw / 2, sy - sw / 2, sw, sw);

    // 内核
    const cw = size * 0.9;
    ctx.globalAlpha = starIn;
    ctx.drawImage(whiteSprite, sx - cw / 2, sy - cw / 2, cw, cw);

    ctx.globalAlpha = 1;
  }

  const statsEl = document.getElementById('stats');

  /* ---------- 目标帧率：120 FPS ----------
     requestAnimationFrame 会被屏幕刷新率锁在 60Hz（60Hz 屏只有 60 帧），
     所以每个 rAF 帧都正常绘制一次，再在两次 vsync 之间按 1/120 秒补画一帧：
       · 60Hz 屏幕 → 60(rAF) + 60(补帧) = 120 帧
       · 120Hz 及以上屏幕 → 不做额外补帧，直接跑满刷新率
     补帧由 rAF 内部调度，保证画面始终落在浏览器的合成帧里。 */
  const TARGET_FPS = 120;
  const FRAME_MS = 1000 / TARGET_FPS;
  let loopTimer = 0;
  let lastFrameAt = 0;

  function drawFrame() {
    const t0 = performance.now();
    let dt = (t0 - last) / 1000;
    last = t0;
    if (!(dt > 0)) dt = 1 / TARGET_FPS;
    if (dt > 0.05) dt = 0.05;        // 掉帧 / 切回标签页时不要跳变
    time += dt;

    update(dt);
    render();

    fpsAcc += dt; fpsFrames++;
    if (fpsAcc > 0.4) {
      fps = fpsFrames / fpsAcc;
      fpsAcc = 0; fpsFrames = 0;
      if (t0 - statsAt > 300) {
        statsAt = t0;
        statsEl.textContent = lights.length + ' 颗星光 · ' + Math.round(fps) + ' FPS';
      }
    }

    lastDrawMs = performance.now() - t0;   // 记录本帧耗时，供补帧判断
  }

  let rafInterval = 16.7;   // 实测屏幕帧间隔（滚动平均）
  let lastRafAt = 0;
  let lastDrawMs = 0;       // 上一帧实际绘制耗时

  // 每一帧都画（保证 canvas 一定在浏览器合成帧内更新上屏）；
  // 若屏幕刷新率低于目标帧率、且这帧画得够快，才在两次 vsync 之间补画一帧。
  // 手机等慢设备单帧耗时超过预算时自动不补帧，退化成 60 帧，不会越跑越卡。
  function rafTick() {
    const now = performance.now();
    if (lastRafAt) rafInterval = rafInterval * 0.9 + (now - lastRafAt) * 0.1;
    lastRafAt = now;

    drawFrame();
    lastFrameAt = now;

    clearTimeout(loopTimer);
    if (rafInterval > FRAME_MS * 1.05 && lastDrawMs < FRAME_MS * 0.6) {
      loopTimer = setTimeout(drawFrame, FRAME_MS);
    }
    requestAnimationFrame(rafTick);
  }

  /* ========================= 交互 ========================= */
  // 拖动旋转已关闭：画布只保留滚轮缩放和双击归位
  canvas.addEventListener('pointerdown', (e) => {
    // 手机上：点画面任意处即收起设置面板
    if (e.pointerType === 'touch' && !panel.classList.contains('closed')) setPanel(false);
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    view.targetZoom = clamp(view.targetZoom * Math.exp(-e.deltaY * 0.0012), 0.5, 2.6);
  }, { passive: false });

  canvas.addEventListener('dblclick', () => {
    view.yaw = 0.35;
    view.pitch = 0.13;
    view.targetZoom = 1;
  });

  /* ========================= 面板绑定 ========================= */
  const panel = document.getElementById('panel');
  const toggleBtn = document.getElementById('toggle');

  const fmt = {
    count: (v) => String(Math.round(v)),
    turns: (v) => v.toFixed(1),
    hue: (v) => Math.round(v) + '°',
    colorful: (v) => Math.round(v * 100) + '%',
    size: (v) => v.toFixed(2),
    glow: (v) => v.toFixed(2),
    twinkle: (v) => v.toFixed(2),
    spin: (v) => v.toFixed(2),
    height: (v) => v.toFixed(2),
    treeRadius: (v) => v.toFixed(2),
    snowLevel: (v) => v.toFixed(2)
  };

  const ranges = Array.prototype.slice.call(document.querySelectorAll('input[type="range"][data-key]'));
  const checks = Array.prototype.slice.call(document.querySelectorAll('input[type="checkbox"][data-key]'));

  function paintRange(el) {
    const min = parseFloat(el.min), max = parseFloat(el.max), v = parseFloat(el.value);
    const p = ((v - min) / (max - min)) * 100;
    el.style.setProperty('--p', clamp(p, 0, 100).toFixed(2) + '%');
  }

  function showOut(key) {
    const el = document.querySelector('[data-out="' + key + '"]');
    if (el && fmt[key]) el.textContent = fmt[key](cfg[key]);
  }

  function syncUI() {
    ranges.forEach((el) => {
      const k = el.dataset.key;
      if (k in cfg) { el.value = cfg[k]; paintRange(el); showOut(k); }
    });
    checks.forEach((el) => {
      const k = el.dataset.key;
      if (k in cfg) el.checked = !!cfg[k];
    });
  }

  ranges.forEach((el) => {
    el.addEventListener('input', () => {
      const k = el.dataset.key;
      const v = parseFloat(el.value);
      cfg[k] = v;
      paintRange(el);
      showOut(k);

      if (k === 'height' || k === 'treeRadius') layout();
      if (k === 'snowLevel') initSnow();
      if (k === 'count' || k === 'turns' || k === 'hue' || k === 'colorful') buildLights();
    });
    el.addEventListener('change', writeHash);
  });

  checks.forEach((el) => {
    el.addEventListener('change', () => {
      cfg[el.dataset.key] = el.checked;
      writeHash();
    });
  });

  /* ========================= 地址栏参数预设 =========================
     例：christmas-tree.html#count=3000&hue=200&colorful=0.7&height=1.2
     面板上改完数值会自动同步到地址栏，方便收藏 / 分享同一套参数 */
  function writeHash() {
    const parts = Object.keys(fmt).map((k) =>
      k + '=' + (k === 'count' ? Math.round(cfg[k]) : Math.round(cfg[k] * 100) / 100)
    );
    parts.push('autoSpin=' + (cfg.autoSpin ? 1 : 0));
    parts.push('snow=' + (cfg.snow ? 1 : 0));
    try { history.replaceState(null, '', '#' + parts.join('&')); } catch (err) { /* file:// 下忽略 */ }
  }

  function applyHash() {
    const raw = String(location.hash || '').replace(/^#/, '');
    if (!raw) return;
    raw.split('&').forEach((kv) => {
      const idx = kv.indexOf('=');
      if (idx < 1) return;
      const k = decodeURIComponent(kv.slice(0, idx));
      const v = decodeURIComponent(kv.slice(idx + 1));
      if (k === 'autoSpin' || k === 'snow') {
        cfg[k] = !(v === '0' || v === 'false');
        return;
      }
      if (!(k in cfg)) return;
      let num = parseFloat(v);
      if (!isFinite(num)) return;
      const el = document.querySelector('input[type="range"][data-key="' + k + '"]');
      if (el) num = clamp(num, parseFloat(el.min), parseFloat(el.max));
      cfg[k] = num;
    });
  }

  // 重播出厂动画：星光重新散开、再聚拢成树
  document.getElementById('replay').addEventListener('click', () => {
    intro = 0;
    buildLights();
  });

  document.getElementById('reset').addEventListener('click', () => {
    Object.assign(cfg, DEFAULTS);
    view.yaw = 0.35;
    view.pitch = 0.13;
    view.targetZoom = 1;
    layout();
    buildLights();
    syncUI();
  });

  function setPanel(open) {
    panel.classList.toggle('closed', !open);
    toggleBtn.classList.toggle('off', open);
  }
  toggleBtn.addEventListener('click', () => setPanel(true));
  document.getElementById('close').addEventListener('click', () => setPanel(false));

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      cfg.autoSpin = !cfg.autoSpin;
      checks.forEach((el) => { if (el.dataset.key === 'autoSpin') el.checked = cfg.autoSpin; });
    } else if (e.key === 'r' || e.key === 'R') {
      document.getElementById('reset').click();
    } else if (e.key === 'h' || e.key === 'H') {
      setPanel(panel.classList.contains('closed'));
    } else if (e.key === 'Escape') {
      setPanel(false);
    }
  });

  window.addEventListener('resize', resize);

  /* ========================= 启动 ========================= */
  applyHash();
  resize();
  buildLights();
  syncUI();
  setPanel(window.innerWidth >= 900);

  /* 可选：#intro=1 直接跳到开场动画结束（等于跳过聚合过程） */
  const introProbe = /(?:^|[#&])intro=([\d.]+)/.exec(location.hash || '');
  if (introProbe) intro = clamp(parseFloat(introProbe[1]) || 0, 0, 1);

  /* 切回标签页时重置时间基准，避免 dt 突变 */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) last = performance.now();
  });

  requestAnimationFrame(rafTick);
})();
</script>
</body>
</html>
